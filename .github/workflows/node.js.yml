name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Check syntax
        run: node --check index.js && echo "✓ Sintaxe OK"
      - name: Verify CLI is executable
        run: test -x index.js || chmod +x index.js && echo "✓ CLI executável"
